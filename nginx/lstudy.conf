# Nginx config for lstudy.in
# Place at: /etc/nginx/sites-available/lstudy.in
# Enable: ln -s /etc/nginx/sites-available/lstudy.in /etc/nginx/sites-enabled/
# SSL:  sudo certbot --nginx -d lstudy.in -d www.lstudy.in
# After changes: nginx -t && nginx -s reload

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=300r/m;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Upstream — Docker container on port 8080
upstream nextjs {
  server 127.0.0.1:8080;
  keepalive 64;
}

# HTTP → HTTPS redirect
server {
  listen 80;
  listen [::]:80;
  server_name lstudy.in www.lstudy.in;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name lstudy.in www.lstudy.in;

  # ── SSL / TLS ─────────────────────────────────────────────────────────────────
  ssl_certificate     /etc/letsencrypt/live/lstudy.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/lstudy.in/privkey.pem;

  # Mozilla "Intermediate" profile — TLS 1.2 + 1.3, ECDHE-only, no RC4/3DES
  ssl_protocols             TLSv1.2 TLSv1.3;
  ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
  ssl_prefer_server_ciphers off;       # TLS 1.3 ignores this; 1.2 clients use server order
  ssl_session_cache         shared:SSL:10m;
  ssl_session_timeout       1d;
  ssl_session_tickets       off;       # Disable session tickets for forward secrecy

  # OCSP stapling — reduces handshake latency + revocation blind-spots
  ssl_stapling        on;
  ssl_stapling_verify on;
  ssl_trusted_certificate /etc/letsencrypt/live/lstudy.in/chain.pem;
  resolver            8.8.8.8 1.1.1.1 valid=300s;
  resolver_timeout    5s;

  # ── Compression ───────────────────────────────────────────────────────────────
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/javascript
             application/json application/xml image/svg+xml;

  # ── Security headers ──────────────────────────────────────────────────────────
  add_header X-Content-Type-Options  "nosniff"                                   always;
  add_header X-Frame-Options         "SAMEORIGIN"                                always;
  # X-XSS-Protection intentionally omitted — deprecated, harmful in IE, CSP covers this.
  add_header Referrer-Policy         "strict-origin-when-cross-origin"           always;
  # HSTS: 2 years, includeSubDomains, preload — matches next.config.ts
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

  # ── Request limits ────────────────────────────────────────────────────────────
  client_max_body_size    100M;
  client_body_timeout     10s;
  client_header_timeout   10s;
  send_timeout            10s;
  keepalive_timeout       65s;

  # ── Connection limit per IP ───────────────────────────────────────────────────
  limit_conn conn_limit 20;

  # ── Block dotfiles, .git, backup files ───────────────────────────────────────
  location ~ /\. {
    deny all;
    return 404;
  }
  location ~* \.(git|env|sql|bak|swp|orig|log|conf|ini)$ {
    deny all;
    return 404;
  }

  # ── Auth endpoints — tighter rate limit ──────────────────────────────────────
  # Covers: /api/auth/*, /api/login, /api/signup, /api/auth/forgot-password/*
  location ~ ^/api/(auth|login|signup) {
    limit_req zone=auth_limit burst=3 nodelay;
    limit_req_status 429;
    proxy_pass http://nextjs;
    include /etc/nginx/proxy_params;
  }

  # ── Health check — no rate limit (for uptime monitors) ───────────────────────
  location = /api/health {
    proxy_pass http://nextjs;
    access_log off;
  }

  # ── API routes — standard rate limit ─────────────────────────────────────────
  location /api/ {
    limit_req zone=api_limit burst=60 nodelay;
    limit_req_status 429;
    proxy_pass http://nextjs;
    include /etc/nginx/proxy_params;
  }

  # ── All other routes → Next.js ────────────────────────────────────────────────
  location / {
    proxy_pass http://nextjs;
    include /etc/nginx/proxy_params;
  }


}
