# Nginx config for the 6 letstudy/* subdomains.
# Place at: /etc/nginx/sites-available/letstudy-subdomains
# Enable:   ln -s /etc/nginx/sites-available/letstudy-subdomains /etc/nginx/sites-enabled/
# SSL (run once DNS resolves for all 6 hosts):
#   certbot --nginx -d home.lstudy.in -d app.lstudy.in -d portal.lstudy.in -d staff.lstudy.in -d py.lstudy.in -d crm.lstudy.in
# After changes: nginx -t && nginx -s reload

limit_req_zone $binary_remote_addr zone=ls_api_limit:10m   rate=300r/m;
limit_req_zone $binary_remote_addr zone=ls_login_limit:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=ls_conn_limit:10m;

upstream ls_home   { server 127.0.0.1:8081; keepalive 32; }
upstream ls_app    { server 127.0.0.1:8082; keepalive 32; }
upstream ls_portal { server 127.0.0.1:8083; keepalive 32; }
upstream ls_staff  { server 127.0.0.1:8084; keepalive 32; }
upstream ls_py     { server 127.0.0.1:8085; keepalive 32; }
upstream ls_crm    { server 127.0.0.1:8086; keepalive 32; }

server {
  listen 80;
  listen [::]:80;
  server_name home.lstudy.in;
  include /etc/nginx/letstudy-common.locations;
  set $ls_upstream ls_home;
}

server {
  listen 80;
  listen [::]:80;
  server_name app.lstudy.in;
  include /etc/nginx/letstudy-common.locations;
  set $ls_upstream ls_app;
}

server {
  listen 80;
  listen [::]:80;
  server_name portal.lstudy.in;
  include /etc/nginx/letstudy-common.locations;
  set $ls_upstream ls_portal;
}

server {
  listen 80;
  listen [::]:80;
  server_name staff.lstudy.in;
  include /etc/nginx/letstudy-common.locations;
  set $ls_upstream ls_staff;
}

server {
  listen 80;
  listen [::]:80;
  server_name py.lstudy.in;
  include /etc/nginx/letstudy-common.locations;
  set $ls_upstream ls_py;
}

server {
  listen 80;
  listen [::]:80;
  server_name crm.lstudy.in;
  include /etc/nginx/letstudy-common.locations;
  set $ls_upstream ls_crm;
}
