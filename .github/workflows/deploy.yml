name: Deploy to AWS Lightsail

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required GitHub secrets (Settings → Secrets → Actions):
#
#   AWS_ACCESS_KEY_ID     — IAM user with LightsailFullAccess policy
#   AWS_SECRET_ACCESS_KEY — IAM user secret
#   AWS_REGION            — e.g. ap-south-1
#
#   DATABASE_URL          — Lightsail DB TCP connection string (used for prisma migrate):
#                           postgresql://lstudyadmin:pass@<ls-db-endpoint>:5432/lstudy
#
#   PYTHON_DOTENV         — Python .env file content (KEY=VALUE per line):
#                             PYTHON_SERVER_SECRET: your-secret
#                             NEXTJS_ORIGIN: https://lstudy.in
#
#   NEXTJS_DOTENV         — Next.js .env file content (KEY=VALUE per line).
#                           DATABASE_URL must be the Lightsail TCP URL (NOT unix socket).
#                           PYTHON_SERVER_URL is injected automatically at deploy time.

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── AWS auth ──────────────────────────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      # ── Install lightsailctl plugin ───────────────────────────────────────────
      - name: Install lightsailctl
        run: |
          sudo curl -Lo /usr/local/bin/lightsailctl \
            "https://s3.us-west-2.amazonaws.com/lightsailctl/latest/linux-amd64/lightsailctl"
          sudo chmod +x /usr/local/bin/lightsailctl

      # ── Create container services if they don't exist ─────────────────────────
      - name: Ensure Lightsail container services exist
        run: |
          wait_ready() {
            local SVC=$1
            for i in $(seq 1 30); do
              STATE=$(aws lightsail get-container-services --service-name "$SVC" \
                --query 'containerServices[0].state' --output text)
              echo "$SVC state: $STATE (attempt $i)"
              [[ "$STATE" == "READY" || "$STATE" == "RUNNING" ]] && return 0
              [ "$i" = "30" ] && echo "Timed out waiting for $SVC to be READY" && return 1
              sleep 15
            done
          }

          for SVC in lstudy-python lstudy-nextjs; do
            STATE=$(aws lightsail get-container-services --service-name "$SVC" \
              --query 'containerServices[0].state' --output text 2>/dev/null || echo "NOTFOUND")
            if [ "$STATE" = "NOTFOUND" ] || [ "$STATE" = "None" ]; then
              echo "Creating $SVC..."
              aws lightsail create-container-service \
                --service-name "$SVC" \
                --power        nano \
                --scale        1
              echo "$SVC creation initiated — waiting for READY..."
              wait_ready "$SVC"
            else
              echo "$SVC already exists (state: $STATE)"
              wait_ready "$SVC"
            fi
          done

      # ── Python: build + push ──────────────────────────────────────────────────
      - name: Build Python image
        run: docker build -t lstudy-python:${{ github.sha }} ./python_server

      - name: Push Python image to Lightsail registry
        id: python_image
        run: |
          aws lightsail push-container-image \
            --service-name lstudy-python \
            --label        deploy-${{ github.sha }} \
            --image        lstudy-python:${{ github.sha }}

          IMAGE=$(aws lightsail get-container-images \
            --service-name lstudy-python \
            --query 'containerImages[0].image' \
            --output text)
          echo "ref=$IMAGE" >> $GITHUB_OUTPUT
          echo "Python image: $IMAGE"

      # ── Python: write deployment spec + deploy ────────────────────────────────
      - name: Write Python deployment spec
        env:
          PYTHON_DOTENV: ${{ secrets.PYTHON_DOTENV }}
        run: |
          python3 - <<'EOF'
          import os, json

          env = {}
          for line in os.environ["PYTHON_DOTENV"].splitlines():
            line = line.strip()
            if not line or line.startswith("#") or "=" not in line:
              continue
            k, _, v = line.partition("=")
            env[k.strip()] = v.strip().strip('"').strip("'")

          spec = {
            "serviceName": "lstudy-python",
            "containers": {
              "lstudy-python": {
                "image": "${{ steps.python_image.outputs.ref }}",
                "ports": {"8000": "HTTP"},
                "environment": env
              }
            },
            "publicEndpoint": {
              "containerName": "lstudy-python",
              "containerPort": 8000,
              "healthCheck": {
                "path": "/health",
                "intervalSeconds": 10,
                "timeoutSeconds": 5,
                "successCodes": "200"
              }
            }
          }

          with open("/tmp/python-deploy.json", "w") as f:
            json.dump(spec, f)
          EOF

      - name: Deploy Python to Lightsail
        run: |
          aws lightsail create-container-service-deployment \
            --cli-input-json file:///tmp/python-deploy.json

          PYTHON_URL=$(aws lightsail get-container-services \
            --service-name lstudy-python \
            --query 'containerServices[0].url' \
            --output text)
          PYTHON_URL="${PYTHON_URL%/}"
          echo "PYTHON_URL=${PYTHON_URL}" >> $GITHUB_ENV
          echo "Python URL: ${PYTHON_URL}"

      # ── DB Migration ──────────────────────────────────────────────────────────
      # No cloud-sql-proxy needed — Lightsail DB is a standard TCP connection.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Run Prisma migration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm ci
          npx prisma generate
          npx prisma migrate deploy

      # ── Next.js: build + push ─────────────────────────────────────────────────
      - name: Build Next.js image
        run: docker build -t lstudy:${{ github.sha }} .

      - name: Push Next.js image to Lightsail registry
        id: nextjs_image
        run: |
          aws lightsail push-container-image \
            --service-name lstudy-nextjs \
            --label        deploy-${{ github.sha }} \
            --image        lstudy:${{ github.sha }}

          IMAGE=$(aws lightsail get-container-images \
            --service-name lstudy-nextjs \
            --query 'containerImages[0].image' \
            --output text)
          echo "ref=$IMAGE" >> $GITHUB_OUTPUT
          echo "Next.js image: $IMAGE"

      # ── Next.js: write deployment spec + deploy ───────────────────────────────
      - name: Write Next.js deployment spec
        env:
          NEXTJS_DOTENV: ${{ secrets.NEXTJS_DOTENV }}
          PYTHON_URL:    ${{ env.PYTHON_URL }}
        run: |
          python3 - <<'EOF'
          import os, json

          env = {}
          for line in os.environ["NEXTJS_DOTENV"].splitlines():
            line = line.strip()
            if not line or line.startswith("#") or "=" not in line:
              continue
            k, _, v = line.partition("=")
            env[k.strip()] = v.strip().strip('"').strip("'")
          env["PYTHON_SERVER_URL"] = os.environ["PYTHON_URL"]

          spec = {
            "serviceName": "lstudy-nextjs",
            "containers": {
              "lstudy-nextjs": {
                "image": "${{ steps.nextjs_image.outputs.ref }}",
                "ports": {"8080": "HTTP"},
                "environment": env
              }
            },
            "publicEndpoint": {
              "containerName": "lstudy-nextjs",
              "containerPort": 8080,
              "healthCheck": {
                "path": "/api/auth/session",
                "intervalSeconds": 10,
                "timeoutSeconds": 5,
                "successCodes": "200"
              }
            }
          }

          with open("/tmp/nextjs-deploy.json", "w") as f:
            json.dump(spec, f)
          EOF

      - name: Deploy Next.js to Lightsail
        run: |
          aws lightsail create-container-service-deployment \
            --cli-input-json file:///tmp/nextjs-deploy.json

          NEXTJS_URL=$(aws lightsail get-container-services \
            --service-name lstudy-nextjs \
            --query 'containerServices[0].url' \
            --output text)
          NEXTJS_URL="${NEXTJS_URL%/}"
          echo "NEXTJS_URL=${NEXTJS_URL}" >> $GITHUB_ENV
          echo "Next.js URL: ${NEXTJS_URL}"

      # ── Wait for deployment to become active ──────────────────────────────────
      - name: Wait for lstudy-nextjs to reach RUNNING state
        run: |
          for i in $(seq 1 20); do
            STATE=$(aws lightsail get-container-services \
              --service-name lstudy-nextjs \
              --query 'containerServices[0].state' \
              --output text)
            echo "Attempt $i: lstudy-nextjs → $STATE"
            [ "$STATE" = "RUNNING" ] && echo "Deployment active." && break
            [ "$i" = "20" ] && echo "Timed out waiting for RUNNING state." && exit 1
            sleep 15
          done

      # ── Health checks ─────────────────────────────────────────────────────────
      - name: Health check — Next.js
        run: |
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 8 "${{ env.NEXTJS_URL }}" || echo "000")
            [ "$STATUS" = "200" ] && echo "Next.js up (attempt $i)" && break
            echo "Attempt $i: $STATUS — retrying in 10s..."
            sleep 10
            [ "$i" = "12" ] && echo "Next.js did not come up (last: $STATUS)" && exit 1
          done

          AUTH=$(curl -s -o /dev/null -w "%{http_code}" "${{ env.NEXTJS_URL }}/api/auth/session")
          [ "$AUTH" = "200" ] && echo "Auth OK" || (echo "Auth returned $AUTH" && exit 1)

      - name: Health check — Python server
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 8 "${{ env.PYTHON_URL }}/health" || echo "000")
          [ "$STATUS" = "200" ] && echo "Python server up" || (echo "Python health failed: $STATUS" && exit 1)
          echo "All health checks passed."
