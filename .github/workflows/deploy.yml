name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DO_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DO_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key "$DO_USER@$DO_HOST" << 'ENDSSH'
            set -e
            cd /var/www/cyber_library
            git checkout -- .
            git pull origin main
            pip3 install --upgrade yt-dlp --quiet
            rm -rf node_modules
            npm ci
            npx prisma generate
            npx prisma migrate deploy
            npm run build
            pm2 reload ecosystem.config.js --update-env
            pm2 save
          ENDSSH

      - name: Health check
        run: |
          echo "Waiting 30s for app to be ready..."
          sleep 30

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://cyberlib.in)
          if [ "$STATUS" != "200" ]; then
            echo "❌ Home page returned $STATUS (expected 200)"
            exit 1
          fi
          echo "✅ Home page OK ($STATUS)"

          DASH=$(curl -s -o /dev/null -w "%{http_code}" -L --max-redirs 1 https://cyberlib.in/dashboard)
          if [ "$DASH" = "200" ] || [ "$DASH" = "307" ]; then
            echo "✅ Dashboard redirect OK"
          else
            echo "❌ Dashboard returned unexpected status $DASH"
            exit 1
          fi

          AUTH=$(curl -s -o /dev/null -w "%{http_code}" https://cyberlib.in/api/auth/session)
          if [ "$AUTH" != "200" ]; then
            echo "❌ /api/auth/session returned $AUTH (expected 200)"
            exit 1
          fi
          echo "✅ Auth session OK"

          echo "🚀 All health checks passed!"
