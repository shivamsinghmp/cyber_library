name: Deploy to DigitalOcean

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required GitHub secrets (Settings → Secrets → Actions):
#
#   DO_DROPLET_IP      — public IP of the DigitalOcean Droplet
#   DO_SSH_PRIVATE_KEY — private SSH key that has access to the Droplet
#
#   NEXTJS_DOTENV      — Next.js .env file content (KEY=VALUE per line).
#                        Must include: DATABASE_URL, AUTH_SECRET, ENCRYPTION_KEY,
#                        NEXTAUTH_URL=https://lstudy.in, and all other app vars.
#                        PYTHON_SERVER_URL is injected automatically.
#
#   PYTHON_DOTENV      — Python .env file content (KEY=VALUE per line):
#                          PYTHON_SERVER_SECRET=your-secret
#                          NEXTJS_ORIGIN=https://lstudy.in

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── SSH setup ─────────────────────────────────────────────────────────────
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DO_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.DO_DROPLET_IP }}" >> ~/.ssh/known_hosts

      # ── Write env files locally, then SCP to Droplet ─────────────────────────
      - name: Write env files
        run: |
          printf '%s\n' "${{ secrets.NEXTJS_DOTENV }}" > /tmp/.env.nextjs
          printf '%s\n' "${{ secrets.PYTHON_DOTENV }}" > /tmp/.env.python

      - name: Copy env files to Droplet
        run: |
          scp -i ~/.ssh/id_rsa /tmp/.env.nextjs root@${{ secrets.DO_DROPLET_IP }}:/opt/lstudy/.env.nextjs
          scp -i ~/.ssh/id_rsa /tmp/.env.python root@${{ secrets.DO_DROPLET_IP }}:/opt/lstudy/.env.python

      # ── Pull code + run migrations + rebuild containers ──────────────────────
      - name: Deploy on Droplet
        run: |
          ssh -i ~/.ssh/id_rsa root@${{ secrets.DO_DROPLET_IP }} << 'ENDSSH'
            set -e
            cd /opt/lstudy
            git pull origin main

            # Run Prisma migrations via Node (installed on host)
            export $(grep -v '^#' .env.nextjs | xargs)
            npm ci --omit=dev --ignore-scripts
            npx prisma migrate deploy

            docker compose -f docker-compose.prod.yml build --pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
          ENDSSH

      # ── Update Nginx config + reload ──────────────────────────────────────────
      - name: Update Nginx config
        run: |
          ssh -i ~/.ssh/id_rsa root@${{ secrets.DO_DROPLET_IP }} << 'ENDSSH'
            cp /opt/lstudy/nginx/lstudy.conf /etc/nginx/sites-available/lstudy.in
            ln -sf /etc/nginx/sites-available/lstudy.in /etc/nginx/sites-enabled/lstudy.in
            nginx -t && nginx -s reload
          ENDSSH

      # ── Health check ──────────────────────────────────────────────────────────
      - name: Health check
        run: |
          echo "Waiting 40s for containers to start..."
          sleep 40
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 8 \
              https://lstudy.in/api/auth/session || echo "000")
            echo "Attempt $i: $STATUS"
            [ "$STATUS" = "200" ] && echo "Health check passed." && exit 0
            sleep 10
          done
          echo "Health check failed after 2 minutes." && exit 1
