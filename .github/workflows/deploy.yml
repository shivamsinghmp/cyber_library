name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required GitHub secrets (Settings → Secrets → Actions):
#
#   GCP_SA_KEY        — Service account JSON key (roles: Cloud Run Admin, Storage Admin, Artifact Registry Writer)
#   GCP_PROJECT_ID    — GCP project ID (e.g. lstudy-prod)
#   GCP_REGION        — Cloud Run region (e.g. asia-south1)
#
#   PYTHON_ENV_YAML   — Python service env vars in Cloud Run YAML format:
#                         PYTHON_SERVER_SECRET: your-secret
#                         NEXTJS_ORIGIN: https://lstudy.in
#
#   NEXTJS_ENV_YAML   — Next.js service env vars in Cloud Run YAML format:
#                         NODE_ENV: production
#                         DATABASE_URL: postgresql://...
#                         AUTH_SECRET: ...
#                         NEXTAUTH_URL: https://lstudy.in
#                         ENCRYPTION_KEY: ...
#                         PYTHON_SERVER_SECRET: your-secret
#                         ... (all your .env keys except PYTHON_SERVER_URL)
#                       Note: PYTHON_SERVER_URL is added automatically at deploy time.
#
#   DATABASE_URL      — Postgres connection string (used only for prisma migrate deploy)

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Google Cloud auth ────────────────────────────────────────────────────
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      # ── Python: build + push ─────────────────────────────────────────────────
      - name: Build Python image
        run: |
          docker build \
            -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/lstudy-python:${{ github.sha }} \
            -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/lstudy-python:latest \
            ./python_server
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/lstudy-python:${{ github.sha }}
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/lstudy-python:latest

      # ── Python: deploy ───────────────────────────────────────────────────────
      - name: Write Python env vars
        env:
          PYTHON_ENV_YAML: ${{ secrets.PYTHON_ENV_YAML }}
        run: printf '%s' "$PYTHON_ENV_YAML" > /tmp/python.env.yaml

      - name: Deploy Python to Cloud Run
        run: |
          gcloud run deploy lstudy-python \
            --image      gcr.io/${{ secrets.GCP_PROJECT_ID }}/lstudy-python:${{ github.sha }} \
            --region     ${{ secrets.GCP_REGION }} \
            --platform   managed \
            --allow-unauthenticated \
            --min-instances 1 \
            --max-instances 4 \
            --memory     512Mi \
            --cpu        1 \
            --concurrency 80 \
            --env-vars-file /tmp/python.env.yaml \
            --quiet

          # Capture stable service URL for Next.js
          PYTHON_URL=$(gcloud run services describe lstudy-python \
            --region ${{ secrets.GCP_REGION }} \
            --format 'value(status.url)')
          echo "PYTHON_URL=$PYTHON_URL" >> $GITHUB_ENV
          echo "Python URL: $PYTHON_URL"

      # ── DB Migration ─────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Run Prisma migration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm ci
          npx prisma generate
          npx prisma migrate deploy

      # ── Next.js: build + push ────────────────────────────────────────────────
      - name: Build Next.js image
        run: |
          docker build \
            -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/lstudy:${{ github.sha }} \
            -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/lstudy:latest \
            .
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/lstudy:${{ github.sha }}
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/lstudy:latest

      # ── Next.js: deploy ──────────────────────────────────────────────────────
      - name: Write Next.js env vars
        env:
          NEXTJS_ENV_YAML: ${{ secrets.NEXTJS_ENV_YAML }}
        run: |
          printf '%s' "$NEXTJS_ENV_YAML" > /tmp/nextjs.env.yaml
          # Append the Python URL captured from the deploy step above
          printf '\nPYTHON_SERVER_URL: "%s"\n' "$PYTHON_URL" >> /tmp/nextjs.env.yaml

      - name: Deploy Next.js to Cloud Run
        run: |
          gcloud run deploy letstudy \
            --image      gcr.io/${{ secrets.GCP_PROJECT_ID }}/lstudy:${{ github.sha }} \
            --region     ${{ secrets.GCP_REGION }} \
            --platform   managed \
            --allow-unauthenticated \
            --min-instances 1 \
            --max-instances 10 \
            --memory     1Gi \
            --cpu        2 \
            --concurrency 100 \
            --env-vars-file /tmp/nextjs.env.yaml \
            --quiet

          NEXTJS_URL=$(gcloud run services describe letstudy \
            --region ${{ secrets.GCP_REGION }} \
            --format 'value(status.url)')
          echo "NEXTJS_URL=$NEXTJS_URL" >> $GITHUB_ENV

      # ── Health checks ────────────────────────────────────────────────────────
      - name: Health check — Next.js
        run: |
          echo "Waiting for Next.js to be ready..."
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 8 ${{ env.NEXTJS_URL }} || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Next.js is up (attempt $i)"
              break
            fi
            echo "Attempt $i: got $STATUS, retrying in 10s..."
            sleep 10
            if [ "$i" = "12" ]; then
              echo "❌ Next.js did not come up (last: $STATUS)"
              exit 1
            fi
          done

          AUTH=$(curl -s -o /dev/null -w "%{http_code}" ${{ env.NEXTJS_URL }}/api/auth/session)
          [ "$AUTH" = "200" ] && echo "✅ Auth OK" || (echo "❌ Auth returned $AUTH" && exit 1)

      - name: Health check — Python server
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 8 ${{ env.PYTHON_URL }}/health || echo "000")
          if [ "$STATUS" = "200" ]; then
            echo "✅ Python server is up"
          else
            echo "❌ Python server health failed (status: $STATUS)"
            exit 1
          fi
          echo "🚀 All health checks passed!"
