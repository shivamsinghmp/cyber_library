<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg512" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#3730A3"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <radialGradient id="bgGlow512" cx="30%" cy="25%" r="60%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlow2" cx="75%" cy="80%" r="50%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pageL512" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C7D2FE" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="pageR512" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EDE9FE"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="spine512" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="40%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#67E8F9"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="bookShadow512">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#0F0A2A" flood-opacity="0.5"/>
    </filter>
    <filter id="spineGlow512">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sparkGlow512">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="outerGlow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="roundClip">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg512)"/>
  <rect width="512" height="512" rx="112" fill="url(#bgGlow512)"/>
  <rect width="512" height="512" rx="112" fill="url(#bgGlow2)"/>

  <!-- Subtle geometric ring decoration -->
  <circle cx="256" cy="210" r="175" fill="none" stroke="url(#ringGrad)" stroke-width="1"/>
  <circle cx="256" cy="210" r="148" fill="none" stroke="#6366F1" stroke-width="0.5" opacity="0.2"/>

  <!-- Dot grid subtle pattern top right -->
  <g opacity="0.08" fill="#818CF8">
    <circle cx="380" cy="60" r="2.5"/><circle cx="400" cy="60" r="2.5"/><circle cx="420" cy="60" r="2.5"/><circle cx="440" cy="60" r="2.5"/>
    <circle cx="380" cy="80" r="2.5"/><circle cx="400" cy="80" r="2.5"/><circle cx="420" cy="80" r="2.5"/><circle cx="440" cy="80" r="2.5"/>
    <circle cx="380" cy="100" r="2.5"/><circle cx="400" cy="100" r="2.5"/><circle cx="420" cy="100" r="2.5"/><circle cx="440" cy="100" r="2.5"/>
    <circle cx="380" cy="120" r="2.5"/><circle cx="400" cy="120" r="2.5"/><circle cx="420" cy="120" r="2.5"/><circle cx="440" cy="120" r="2.5"/>
  </g>
  <!-- Dot grid bottom left -->
  <g opacity="0.08" fill="#22D3EE">
    <circle cx="72" cy="380" r="2.5"/><circle cx="92" cy="380" r="2.5"/><circle cx="112" cy="380" r="2.5"/>
    <circle cx="72" cy="400" r="2.5"/><circle cx="92" cy="400" r="2.5"/><circle cx="112" cy="400" r="2.5"/>
    <circle cx="72" cy="420" r="2.5"/><circle cx="92" cy="420" r="2.5"/><circle cx="112" cy="420" r="2.5"/>
  </g>

  <!-- Book group -->
  <g filter="url(#bookShadow512)" transform="translate(256,210) scale(1)">

    <!-- Left page -->
    <path d="
      M -125 -105
      C -125 -115, -115 -122, -103 -122
      L -10 -118
      L -10 118
      L -103 114
      C -115 114, -125 107, -125 97
      Z
    " fill="url(#pageL512)"/>

    <!-- Right page -->
    <path d="
      M 125 -105
      C 125 -115, 115 -122, 103 -122
      L 10 -118
      L 10 118
      L 103 114
      C 115 114, 125 107, 125 97
      Z
    " fill="url(#pageR512)"/>

    <!-- Spine -->
    <rect x="-13" y="-130" width="26" height="260" rx="13" fill="url(#spine512)" filter="url(#spineGlow512)"/>

    <!-- Lines left page -->
    <rect x="-110" y="-48" width="82" height="7" rx="3.5" fill="#4F46E5" opacity="0.2"/>
    <rect x="-110" y="-28" width="70" height="7" rx="3.5" fill="#4F46E5" opacity="0.2"/>
    <rect x="-110" y="-8"  width="78" height="7" rx="3.5" fill="#4F46E5" opacity="0.18"/>
    <rect x="-110" y="12"  width="60" height="7" rx="3.5" fill="#4F46E5" opacity="0.14"/>
    <rect x="-110" y="32"  width="72" height="7" rx="3.5" fill="#4F46E5" opacity="0.12"/>
    <rect x="-110" y="52"  width="55" height="7" rx="3.5" fill="#4F46E5" opacity="0.1"/>

    <!-- Lines right page -->
    <rect x="28" y="-48" width="82" height="7" rx="3.5" fill="#7C3AED" opacity="0.28"/>
    <rect x="28" y="-28" width="68" height="7" rx="3.5" fill="#7C3AED" opacity="0.28"/>
    <rect x="28" y="-8"  width="76" height="7" rx="3.5" fill="#7C3AED" opacity="0.22"/>
    <rect x="28" y="12"  width="58" height="7" rx="3.5" fill="#7C3AED" opacity="0.18"/>
    <rect x="28" y="32"  width="70" height="7" rx="3.5" fill="#7C3AED" opacity="0.14"/>
    <rect x="28" y="52"  width="50" height="7" rx="3.5" fill="#7C3AED" opacity="0.1"/>

  </g>

  <!-- Large sparkle top right -->
  <path d="M 400 72 L 406 90 L 424 96 L 406 102 L 400 120 L 394 102 L 376 96 L 394 90 Z"
    fill="url(#starGrad)" filter="url(#sparkGlow512)"/>
  <!-- Small sparkle -->
  <path d="M 430 50 L 433 58 L 441 61 L 433 64 L 430 72 L 427 64 L 419 61 L 427 58 Z"
    fill="#67E8F9" opacity="0.8" filter="url(#sparkGlow512)"/>
  <!-- Tiny sparkle left -->
  <path d="M 82 148 L 84 154 L 90 156 L 84 158 L 82 164 L 80 158 L 74 156 L 80 154 Z"
    fill="#A78BFA" opacity="0.6"/>

  <!-- Ground shadow ellipse -->
  <ellipse cx="256" cy="338" rx="115" ry="10" fill="#0F0A2A" opacity="0.25"/>

  <!-- Text: THE CYBER LIBRARY -->
  <text x="256" y="400" 
    font-family="Georgia, 'Times New Roman', serif" 
    font-size="38" 
    font-weight="700"
    fill="#E0E7FF"
    text-anchor="middle"
    letter-spacing="2">THE CYBER LIBRARY</text>

  <!-- Tagline -->
  <text x="256" y="432"
    font-family="'Trebuchet MS', sans-serif"
    font-size="16"
    fill="#6366F1"
    text-anchor="middle"
    letter-spacing="5"
    opacity="0.9">LEARN · GROW · CONNECT</text>

  <!-- Decorative line under tagline -->
  <line x1="156" y1="448" x2="356" y2="448" stroke="#3730A3" stroke-width="1" opacity="0.5"/>
  <circle cx="256" cy="448" r="3" fill="#22D3EE" opacity="0.7"/>

</svg>
