<svg width="100" height="100" viewBox="0 0 100 100"
  xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#0F2040"/>
    </linearGradient>
  </defs>
  <!-- Hexagon background -->
  <polygon
    points="50,6 88,28 88,72 50,94 12,72 12,28"
    fill="url(#bg)"
    stroke="#3B82F6"
    stroke-width="2"/>
  <!-- Corner accent dots -->
  <circle cx="50" cy="6"  r="2.5" fill="#F59E0B"/>
  <circle cx="88" cy="28" r="2.5" fill="#3B82F6"/>
  <circle cx="88" cy="72" r="2.5" fill="#06B6D4"/>
  <circle cx="50" cy="94" r="2.5" fill="#38BDF8"/>
  <circle cx="12" cy="72" r="2.5" fill="#06B6D4"/>
  <circle cx="12" cy="28" r="2.5" fill="#3B82F6"/>
  <!-- Book left page -->
  <path d="M50,26 L26,33 L26,68 L50,61 Z"
    fill="#3B82F6" opacity="0.9"/>
  <!-- Book right page -->
  <path d="M50,26 L74,33 L74,68 L50,61 Z"
    fill="#06B6D4" opacity="0.9"/>
  <!-- Book spine -->
  <line x1="50" y1="26" x2="50" y2="61"
    stroke="#E0F2FE" stroke-width="1.5" opacity="0.7"/>
  <!-- Left page lines -->
  <line x1="30" y1="44" x2="47" y2="41"
    stroke="#93C5FD" stroke-width="1" opacity="0.6"/>
  <line x1="30" y1="51" x2="47" y2="49"
    stroke="#93C5FD" stroke-width="1" opacity="0.5"/>
  <line x1="30" y1="58" x2="47" y2="56"
    stroke="#93C5FD" stroke-width="0.7" opacity="0.3"/>
  <!-- Right page lines -->
  <line x1="53" y1="41" x2="70" y2="44"
    stroke="#67E8F9" stroke-width="1" opacity="0.6"/>
  <line x1="53" y1="49" x2="70" y2="51"
    stroke="#67E8F9" stroke-width="1" opacity="0.5"/>
  <line x1="53" y1="56" x2="70" y2="58"
    stroke="#67E8F9" stroke-width="0.7" opacity="0.3"/>
  <!-- Gold top dot + signal -->
  <circle cx="50" cy="20" r="3" fill="#F59E0B"/>
  <line x1="50" y1="11" x2="50" y2="17"
    stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
</svg>
